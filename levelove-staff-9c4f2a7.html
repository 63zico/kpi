<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>식당 직원 일일 미션/승인 관리 - 직원관리</title>
    <link rel="stylesheet" href="styles.css?v=20260603-local-pending-recovery-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <span class="crewly-logo" aria-hidden="true">L</span>
        <div>
          <p class="eyebrow">Staff Links</p>
          <h1>직원 링크 관리</h1>
          <p class="brand-subtitle">직원별 접속 링크와 역할을 관리합니다. 직원은 링크로 일일 미션을 제출합니다.</p>
        </div>
      </div>
      <div class="top-actions">
        <a class="btn ghost" href="levelove-admin-9c4f2a7.html?v=20260603-local-pending-recovery-1">관리자 화면</a>
        <a class="btn ghost" href="employee-check.html?preview=1&v=20260603-local-pending-recovery-1">직원 미리보기</a>
        <a class="btn ghost" href="levelove-store-9c4f2a7.html?v=20260603-local-pending-recovery-1">매장 설정</a>
        <button id="addStaffBtn" class="btn primary" type="button">직원 추가</button>
        <button id="resetStaffBtn" class="btn ghost" type="button">기본값 복원</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel staff-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Roster</p>
            <h2>직원 목록</h2>
            <p class="section-note">일반 직원은 전용 링크로 직원앱에 접속하고, 매니저는 관리자 화면에서 승인과 검수를 담당합니다.</p>
          </div>
          <div class="staff-panel-tools">
            <label class="staff-toggle">
              <input id="showInactiveStaff" type="checkbox" />
              <span>비활성 직원 보기</span>
            </label>
            <span id="staffSyncStatus" class="pill">직원 목록 준비중</span>
          </div>
        </div>
        <div id="staffSummary" class="staff-summary-grid"></div>
        <div id="staffEditor" class="staff-editor"></div>
      </section>
    </main>

    <script src="supabase-config.js?v=20260520-staff-access-1"></script>
    <script src="auth.js?v=20260603-local-pending-recovery-1"></script>
    <script src="cloud-state.js?v=20260603-local-pending-recovery-1"></script>
    <script src="staff.js?v=20260603-local-pending-recovery-1"></script>
