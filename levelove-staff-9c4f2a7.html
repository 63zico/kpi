<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eafcff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LEVELOVE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>식당 직원 일일 미션/승인 관리 - 직원관리</title>
    <link rel="manifest" href="manifest.webmanifest?v=20260608-pwa-test-1" />
    <link rel="apple-touch-icon" href="assets/levelove-icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=20260605-core-rank-2" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <span class="crewly-logo" aria-hidden="true">L</span>
        <div>
          <p class="eyebrow">Single Source</p>
          <h1>직원 원본 관리</h1>
          <p class="brand-subtitle">직원 이름, 역할, 링크는 여기서만 추가/수정합니다. 사장설정과 매니저 화면은 이 목록을 읽어옵니다.</p>
        </div>
      </div>
      <div class="top-actions">
        <a class="btn ghost" href="levelove-admin-9c4f2a7.html?v=20260605-core-rank-2">관리자 화면</a>
        <a class="btn ghost" href="employee-check.html?preview=1&v=20260605-core-rank-2">직원 미리보기</a>
        <a class="btn ghost" href="levelove-store-9c4f2a7.html?v=20260605-core-rank-2">매장 설정</a>
        <button id="addStaffBtn" class="btn primary" type="button">직원 추가</button>
        <button id="resetStaffBtn" class="btn ghost" type="button">기본값 복원</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel staff-panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Roster</p>
            <h2>직원/매니저 목록</h2>
            <p class="section-note">매니저도 같은 직원 목록 안에서 역할만 매니저로 지정합니다. 일반 직원은 직원앱 링크, 매니저는 승인 링크를 사용합니다.</p>
          </div>
          <div class="staff-panel-tools">
            <label class="staff-toggle">
              <input id="showInactiveStaff" type="checkbox" />
              <span>비활성 직원 보기</span>
            </label>
            <span id="staffSyncStatus" class="pill">직원 목록 준비중</span>
          </div>
        </div>
        <div id="staffSummary" class="staff-summary-grid"></div>
        <div id="staffEditor" class="staff-editor"></div>
      </section>
    </main>

    <script src="supabase-config.js?v=20260520-staff-access-1"></script>
    <script src="auth.js?v=20260605-core-rank-2"></script>
    <script src="cloud-state.js?v=20260605-core-rank-2"></script>
    <script src="staff.js?v=20260605-core-rank-2"></script>
    <script src="pwa.js?v=20260608-pwa-test-1"></script>
  </body>
